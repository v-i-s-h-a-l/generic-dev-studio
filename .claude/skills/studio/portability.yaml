notes: |
  Studio router is a project-scoped vendor skill — it auto-loads only when
  cwd is inside generic-dev-studio. Installing it globally would cause studio
  ops to misfire from unrelated projects. Codex support is project-scoped via
  .codex/skills/studio; keep the canonical router under .claude/skills/studio
  until the host adapter layout grows a host-neutral project-skill root.
