schema_version: 1
name: studio
invocation:
  slash_command: "/studio"
  triggers:
    - "/studio"
    - "/studio resume-plan"
    - "where were we"
    - "pick up from where we left off"
    - "/studio review"
    - "review this diff"
    - "/studio release"
    - "draft release notes"
    - "should we tag"
    - "/studio ingest"
    - "/studio analyze"
    - "/studio summary"
    - "safe to end session"
    - "what changed"
    - "wrap this up"
    - "/studio help"
    - "/studio audit"
    - "/studio guard <topic>"
    - "/studio janitor"
    - "/studio nodes"
    - "sync the workers"
    - "sync workers"
    - "push to workers"
    - "update the workers"
    - "are the workers in sync"
    - "/studio work <track>"
    - "STUDIO_TRACK=<track>"
    - "/studio tf-push"
    - "/studio tf-push --dry-run"
    - "push a TestFlight build via studio"
domains:
  - studio-internal
