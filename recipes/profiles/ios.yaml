# recipes/profiles/ios.yaml — curator's iOS development profile.
#
# Recipes listed here install when the user runs `studio install-recommended`
# or `studio install-recommended ios`. Profiles compose into a single
# "install everything for this domain" command so a fresh machine bootstrap
# is one shell line instead of N manual fetches.
#
# Adding a recipe to a profile is a curatorial decision: is this skill load-
# bearing for the domain, or just nice-to-have? Profiles stay slim; lots of
# nice-to-have skills go straight into the recipes/ tree but stay out of
# any profile until they earn the spot.
#
# Recipes referenced here MUST exist as recipes/<recipe-name>.yaml or
# recipes/<dir>/<recipe-name>.yaml — install-recipe.sh resolves by exact
# filename match.

schema_version: 1

display_name: "iOS development"
description: |
  SwiftUI authoring + review, Swift concurrency review, Swift Testing,
  API design + module architecture skills. Curated against the user's
  ~/.claude-personal/CLAUDE.md skill conventions.

# Curated against the user's ~/.claude-personal/CLAUDE.md skill conventions.
# Authors sourced via the twostraws/Swift-Agent-Skills community index
# (https://github.com/twostraws/Swift-Agent-Skills). All MIT-licensed.
#
# Slash-command name = upstream skill `name:` field. Two of the user's CLAUDE.md
# slash commands differ from the upstream names:
#   /swiftui-expert-skill  → installed as `/swiftui-pro` (twostraws/SwiftUI-Agent-Skill)
#   /swift-testing-expert  → installed as `/swift-testing-pro` (twostraws/Swift-Testing-Agent-Skill)
# Update ~/.claude-personal/CLAUDE.md to use the upstream names, or alias
# locally — the studio respects whatever is on disk.

recipes:
  - swiftui-pro                       # SwiftUI authoring + review (Paul Hudson)
  - swiftui-view-refactor             # SwiftUI view-splitting (Thomas Ricouard)
  - swiftui-performance-audit         # Scroll-jank / hitch diagnosis (Thomas Ricouard)
  - swiftui-liquid-glass              # iOS 26+ Liquid Glass adoption (Thomas Ricouard)
  - swift-concurrency-pro             # async/await + actors + Sendable (Paul Hudson)
  - swift-testing-pro                 # @Test / #expect / test plans (Paul Hudson)
  - swift-api-design-guidelines-skill # Swift API design conventions (Erik Sebastián de Erice)
  - swift-architecture-skill          # MVVM / TCA / Clean Architecture (Lasha Efremidze)

# `scripts/install-recommended.sh ios` iterates this list, calling
# install-recipe.sh for each. License + author allowlists gate every install;
# failures are surfaced and skipped, the run continues for the rest.
