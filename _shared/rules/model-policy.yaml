schema_version:
  name: model-policy
  version: 1.1.0
  min_reader: 1.0.0
  deprecated_at: null
default_preference: best_result
allow_inline_override: true
catalog: _shared/schemas/model-catalog.yaml
recommendation_fields:
  - task.size
  - task.kind
  - task.cross_file_count
  - task.novelty_score
provider_families:
  openai:
    adapters:
      - codex
      - codex-reviewer
  anthropic:
    adapters:
      - claude-code
      - claude
      - claude-reviewer
roles:
  implementer.heavyweight:
    purpose: non-trivial implementation, schema changes, migrations, architecture-sensitive edits
    role_suitability: implementer
    reasoning_effort: high
    model_preferences:
      - opus
      - openai_gpt_5_5
      - openai_gpt_5_3_codex
      - openai_gpt_5_2
    downgrade_requires_telemetry: true
  reviewer.heavyweight:
    purpose: Argus-style PR review, safety-floor review, cross-file regression review
    role_suitability: reviewer
    reasoning_effort: medium
    independent_provider_family_required: true
    model_preferences:
      - sonnet
      - openai_gpt_5_5
      - openai_gpt_5_3_codex
      - openai_gpt_5_2
      - openai_gpt_5
      - opus
    downgrade_requires_telemetry: true
  reviewer.fallback:
    purpose: user-approved same-family fallback when no independent eligible reviewer can run
    role_suitability: reviewer
    reasoning_effort: medium
    user_approved_bypass_required: true
    model_preferences:
      - sonnet
      - openai_gpt_5_5
      - openai_gpt_5_3_codex
      - openai_gpt_5_2
      - openai_gpt_5
      - opus
  planner.heavyweight:
    purpose: Claude planner/architect planning, decomposition, and plan review preparation
    role_suitability: planner
    reasoning_effort: medium
    model_preferences:
      - sonnet
      - openai_gpt_5_5
      - openai_gpt_5_3_codex
      - openai_gpt_5_2
      - openai_gpt_5
      - opus
    opus_requires_explicit_extreme_need: true
  reviewer.reasoning_effort:
    default: medium
    routine_after_telemetry: medium
    rule: "Use Sonnet 4.6 with high effort for Claude review/planner defaults. Opus is a last-resort tier only when explicitly justified as extreme need; do not use unverified Opus snapshots such as Opus 4.7 by default."
reviewer_selection:
  default_role: reviewer.heavyweight
  fallback_role: reviewer.fallback
  exclude_implementation_provider_family: true
  block_without_independent_reviewer: true
  bypass:
    env: STUDIO_ALLOW_SAME_HOST_REVIEW
    flag: --allow-same-host-review
    requires_user_approved_bypass_url: true
  metadata_fields:
    - selected_review_host
    - selected_review_provider_family
    - selected_review_model_id
    - selected_review_reasoning_effort
refresh:
  command: scripts/check-model-catalog.sh --print-refresh-checklist
  required_before:
    - changing role defaults
    - changing model_preferences
    - changing adapter/provider-family mappings
