---
schema_version:
  name: skill-layout
  version: 1.0.0

# Expected-layout manifest for shared skill deployments (#262).
#
# scripts/skill-self-check.sh walks this manifest against the deployed
# skills-root (the directory containing _shared/, scripts/, and the per-agent
# dirs — typically ~/.claude-personal/skills/ on the Claude Code adapter,
# resolved by the script via `dirname` from its own path).
#
# A10 removed the v1 top-level owned-agent skills. This manifest now validates
# only shared companions and host adapter capability anchors for deployed roots.
#
# Companions (_shared, scripts) are skills-root-level shared resources
# (sync-host-skills.sh COMPANIONS array). They are checked relative to
# skills-root.

companions:
  # Skills-root-level resources required by every owned agent's SKILL.md
  # prose ("Pattern contract: _shared/patterns/...", "RUN scripts/..."").
  required_dirs:
    - _shared
    - scripts
  required_files:
    - _shared/patterns/router-pattern.md
    - _shared/contracts/events.md
    - scripts/lib-paths.sh
    - scripts/lib-ledger.sh

# Host adapter dirs deployed by sync-host-skills.sh (#297).
# Each adapted host's capabilities dir must be present at the skills-root.
# skill-self-check.sh detects the current host from the skills-root path
# and validates only the matching adapter.
adapters:
  claude-code:
    global_skill_dir: "~/.claude/skills"
    required_files:
      - .claude-plugin/capabilities.yaml
  codex:
    global_skill_dir: "~/.codex/skills"
    required_files:
      - .codex/capabilities.yaml

agents: {}
