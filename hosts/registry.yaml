# hosts/registry.yaml — authoritative host roster for skill fan-out.
#
# One row per host. Adding a new host = one row here + one .<host>/capabilities.yaml
# (per hosts/ADAPTER-SPEC.md) + one entry in the per-host tool-dialect map at
# _shared/tool-dialect/<host>.md (when needed). scripts/sync-host-skills.sh and
# scripts/generate-routing.sh consume this file as the single source of truth
# for "what hosts exist and where do their skills live".
#
# Schema versioned via _shared/standards/host-registry.json (validated by
# scripts/lint-skill-prose.sh when present).
#
# Required fields: display_name, provider_family, global_skill_dir, detect_binary.
# Optional fields marked below. Empty required values reject at lint time.
#
# provider_family: stable company/model-family key used by reviewer policy.
# Dedicated profiles from the same provider (for example codex and
# codex-reviewer) share one family so review gates can enforce independent
# reviewer selection.
#
# detect_binary: checked by `sync-host-skills.sh --all` to skip hosts whose
# CLI is not installed on this machine. Value is a binary name resolved via
# `command -v`. Hosts without the binary on PATH are silently skipped during
# --all fan-out (explicit single-host sync still works regardless).
#
# status: "adapted" = full adapter (./<host>/ dir + capabilities.yaml + hooks);
#         "provisional" = registry entry only, no adapter yet — sync creates
#         symlinks but the host can't dispatch workers until adapted.

claude-code:
  display_name: "Claude Code"
  provider_family: anthropic
  detect_binary: claude
  global_skill_dir: "~/.claude/skills"
  project_skill_dir: ".claude/skills"
  routing_file: "CLAUDE.md"
  routing_walks_parents: true
  capabilities_path: ".claude-plugin/capabilities.yaml"
  global_instructions_path: "~/.claude-personal/CLAUDE.md"
  tool_dialect: claude
  status: adapted

