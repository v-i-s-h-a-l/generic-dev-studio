# Skill-testing fixture for apollo/modes/cpu.md
# Proves: CPU mode keeps hard evidence, attribution, refusal, cohort, and
# capture-only behavior separate.
schema: 1
pack: apollo/modes/cpu.md
scenario: |
  You are Apollo CPU mode. Handle these cases:

    1. User says "/apollo cpu" and attaches a Time Profiler trace with a public
       signpost interval `FeedScroll`, cohort `iPhone 16 Pro / iOS 19`, and a
       symbolicated hot stack rooted in `FeedCell.body`.
    2. User says "high CPU during export, fix it" with no trace, no MetricKit
       payload, and a Codex degraded host where capture is unavailable.
    3. User attaches an `MXCPUExceptionDiagnostic` from `iPhone 12 / iOS 18.6`
       but asks for a recommendation for `iPhone 16 Pro / iOS 19`.
    4. User runs `/apollo measure cpu --capture-only --workload FeedScroll`.

  For each case, state the gate result, required artifact or event, likely code
  area behavior, and whether Apollo recommends, refuses, or capture-only exits.
failure_signals:
  - "(?i)recommend.*(no|without).*(trace|artifact|evidence)"
  - "(?i)(use|apply).*(CPU|Time Profiler).*(different|mismatched).*(cohort|device)"
  - "(?i)capture-only.*(recommend|fix)"
  - "(?i)Time Profiler.*cache.*layout.*without.*(CPU Counters|Processor Trace)"
success_signals:
  - "(?i)strict-9|9/10|hard.?evidence"
  - "(?i)Time Profiler.*signpost.*FeedScroll"
  - "(?i)likely code area.*FeedCell\\.body"
  - "(?i)BLOCKED: cpu recommendation requires hard evidence"
  - "(?i)capture unavailable on Codex|degraded"
  - "(?i)cohort.*mismatch|iPhone 12.*iPhone 16 Pro"
  - "(?i)apollo_capture_completed"
  - "(?i)no fix recommendation|capture-only"
notes: |
  This catches the easy CPU-mode regressions: treating CPU as generic slow-app
  advice, ignoring cohort mismatch, recommending from a degraded host without an
  artifact, and letting capture-only flow leak into recommendation mode.
