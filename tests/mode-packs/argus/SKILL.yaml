# Skill-testing fixture for argus/SKILL.md
# Proves: scope caps + week-1 block-vs-flag posture + base-staleness check.
schema: 1
pack: argus/SKILL.md
scenario: |
  An Achilles task has just finished a refactor with a 1200-line diff across
  14 files. Self-review is green. You are now invoked as Argus. Describe:
    1. What you load before reviewing (and any caps that apply).
    2. Which findings would BLOCK the merge and which would only FLAG.
    3. How you decide whether the base branch is stale relative to this
       worktree, and what event you emit when it is.
  Be specific — name scripts, numeric caps, and event names.
failure_signals:
  # Without the pack, the subagent invents review criteria — generic prose
  # about "checking for bugs", or asks for the diff contents verbatim.
  - "(?i)(provide|share|paste).*(diff|code|changes|files)"
  - "(?i)(generic|general|typical) (review|checklist|best practice)"
  - "(?i)depend(s|ing) on (the|your) (codebase|project|standards)"
success_signals:
  # With the pack, Argus knows its specific caps and posture.
  - "10 .*(neighbor|file)"
  - "50 line"
  - "500"
  - "(?i)week.1"
  - "review_scoped"
notes: |
  Week-1 posture is the load-bearing policy: only compile-fail / test-fail /
  secrets / base-staleness block. Everything else flags. Without the pack,
  there's no way to know this — the subagent will default to "block on any
  quality issue" which is the exact posture Argus is designed NOT to have.
