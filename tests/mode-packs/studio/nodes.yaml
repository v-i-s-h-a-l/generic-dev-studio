# Skill-testing fixture for .claude/skills/studio/modes/nodes.md
# Proves: nodes mode dispatches to the right scripts, never bootstraps,
# never edits nodes.json directly, and refuses out-of-scope work.
schema: 1
pack: .claude/skills/studio/modes/nodes.md
scenario: |
  You are running the studio "nodes" mode. For each invocation below, name:
    - the exact shell command(s) the mode runs (in order),
    - what is rendered to the user,
    - any out-of-scope path you would refuse and where you would route instead.

  State at the start of each scenario:
    - ~/.dev-studio/.runtime/nodes.json contains:
        { id: "mini", host: "mini.local", user: "vs",
          roles: ["swift-test","xcodebuild"], enabled: true }
    - The launchd worker-sync agent is NOT installed.
    - "mini" is currently reachable; load1 = 1.4.

  Invocations:

    1. `/studio nodes`                               (default, no arg)
    2. `/studio nodes status`
    3. `/studio nodes add` (no inline args — user wants prompts)
    4. `/studio nodes add --id mac-studio --host studio.local --roles swift-test`
    5. `/studio nodes remove mini`
    6. `/studio nodes disable mini`
    7. `/studio nodes health`
    8. `/studio nodes health mini`
    9. `/studio nodes sync` (no id, no --all)
    10. `/studio nodes sync --all`
    11. `/studio nodes sync mini --dry-run`
    12. `/studio nodes schedule on`
    13. `/studio nodes schedule status`
    14. `/studio nodes bootstrap` (user wants to re-bootstrap a worker)
    15. `/studio nodes manifest` (user wants to edit the manifest YAML)
    16. State has zero registered workers; user runs `/studio nodes`.

  Also confirm:
    - Does this mode ever invoke `scripts/bootstrap.sh`?
    - Does this mode ever write to `nodes.json` with the `Edit` or `Write` tool?
    - Where does scheduled-sync state live, and is it inside `~/.dev-studio/**`?

failure_signals:
  - "(?i)bootstrap\\.sh"
  - "(?i)(Edit|Write) tool.*nodes\\.json"
  - "(?i)write.*nodes\\.json.*directly"
  - "(?i)/studio nodes (bootstrap|onboard|setup)"
  - "(?i)dispatch.*build.*to.*worker"
success_signals:
  - "(?i)scripts/configure\\.sh status"
  - "(?i)scripts/node-health\\.sh"
  - "(?i)scripts/worker-status\\.sh"
  - "(?i)scripts/configure\\.sh worker (add|remove|enable|disable)"
  - "(?i)scripts/sync-worker\\.sh"
  - "(?i)scripts/sync-workers-all\\.sh"
  - "(?i)scripts/configure\\.sh schedule"
  - "(?i)/studio-setup"
  - "(?i)scripts/configure\\.sh manifest"
  - "(?i)(ask|prompt).*one worker.*all workers"
  - "(?i)(none|no workers|agents-only).*registered"
  - "(?i)(LaunchAgents|launchd).*outside.*~/\\.dev-studio"
notes: |
  Load-bearing properties of nodes.md this fixture catches:
    - Default (no arg) routes to `status`, not an error.
    - `status` runs the three-script triple, never just one.
    - Mutations go through `configure.sh worker …`, never the Edit/Write tool.
    - `sync` with no id and no --all asks before guessing.
    - Onboarding requests redirect to `/studio-setup`; manifest edits redirect
      to `scripts/configure.sh manifest`.
    - Zero-workers state short-circuits cleanly without running health/fleet
      probes against an empty registry.
    - The launchd plist write is the one documented exception to the
      ~/.dev-studio/** rule; the mode is honest about that.
