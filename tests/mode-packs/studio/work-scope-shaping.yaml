schema: 1
pack: .claude/skills/studio/modes/work.md
scenario: |
  A track issue says only "make ingest faster". It has no acceptance criteria,
  no before/after behavior, and the likely implementation could change workflow
  semantics. Explain what work mode must do before editing files.
failure_signals:
  - "implement exactly"
success_signals:
  - "scope-shaping checkpoint"
