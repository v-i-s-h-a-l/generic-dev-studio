# Skill-testing fixture for .claude/skills/studio/SKILL.md
# Proves: dispatch-table correctness — the studio router sends each sub-command
# to the right mode pack, and correctly refuses task-level work.
schema: 1
pack: .claude/skills/studio/SKILL.md
scenario: |
  You are the studio router. A user sends the following invocations in sequence.
  For each one, name the mode pack that loads (exact file under modes/) or, if
  the invocation is out of scope, explain where it should route instead.

    1. `/studio resume-plan`
    2. "where were we?" (no explicit command)
    3. `/studio review` with a studio-repo diff pending
    4. "should we tag?" after landing three commits on main
    5. `/studio help`
    6. "show me the docs"
    7. `/studio audit` (or conversational "audit the arc")
    8. `/studio guard "host-agnostic workers"` (or "has this been done?")
    9. `/studio` with no argument
    10. `/studio brief T001` (user wants to brief a task on their iOS project)
    11. `/studio nodes` or "show the fleet" / "list workers"
    12. `/studio nodes sync --all`
    13. "I want to onboard my Mac mini as a worker" (user wants to bootstrap)

  Also confirm: is the studio router singleton? Does it emit `agent_boot` events?
failure_signals:
  # Without the router pack, a generic agent will invent modes, conflate the
  # studio with chanakya, or dispatch task-level work through /studio.
  - "(?i)(provide|share|paste).*(file|code|path)"
  - "(?i)modes/brief\\.md"
  - "(?i)(singleton|locked|agent_boot).*(yes|emit|required)"
  - "(?i)route .*brief.* to .*studio"
success_signals:
  - "modes/resume-plan\\.md"
  - "modes/review\\.md"
  - "modes/release\\.md"
  - "modes/help\\.md"
  - "modes/audit\\.md"
  - "modes/guard\\.md"
  - "modes/nodes\\.md"
  - "(?i)(not singleton|no lock|no agent_boot)"
  - "(?i)(chanakya|achilles).*(brief|task|dispatch)"
  - "(?i)(default|no arg).*(resume-plan|pickup)"
  - "(?i)/studio-setup"
  - "(?i)bootstrap.*not.*nodes mode"
notes: |
  The load-bearing properties of .claude/skills/studio/SKILL.md that this fixture catches:
    - Explicit arg wins: `/studio resume-plan` → modes/resume-plan.md.
    - Intent routing: "where were we" → resume-plan; "should we tag?" → release;
      "show me the docs" → help.
    - Default (no arg) routes to resume-plan, not an error.
    - Task-level work (`/studio brief T001`) is out of scope — router redirects
      to /chanakya or /achilles, never dispatches internally.
    - Not singleton; no agent_boot event. A subagent without the pack will
      typically assume studio is an orchestrator-style singleton like chanakya.
    - `nodes` is day-2 ops; bootstrap requests redirect to `/studio-setup`.
