schema_version: 1
hosts:
  - claude-code
scope: global
incompatible:
  codex: "Apollo's execution surface (XcodeBuildMCP, AXe, xctrace, ASC) hasn't been verified portable to Codex yet. Stage 5 (#235) widens portability after the first mode pack lands and runs a host-conformance pass; until then, Apollo is claude-code only."
notes: |
  Apollo is in scaffold state (Stage 4, #234). Mode packs (#230 memory,
  #231 thermal, #232 battery) ship in Stage 2; portability to additional
  hosts is gated on a working mode pack + the conformance suite at
  scripts/test-host.sh.
