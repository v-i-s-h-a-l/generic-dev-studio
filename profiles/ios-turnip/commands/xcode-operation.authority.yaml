action: ios-profile-operation
role: helper
filesystem:
  reads:
    - "$STUDIO_PROJECT_ROOT/**"
    - "$STUDIO_PROJECT_ROOT/.studio/chain-task-start.json"
  writes:
    - "$STUDIO_PROJECT_ROOT/**"
    - "$STUDIO_IOS_ARTIFACT_ROOT/**"
    - "$STUDIO_CHAIN_ARTIFACT_ROOT/**"
    - "$TMPDIR/studio-ios-artifacts/**"
commands:
  - xcodebuild
  - sh
  - tee
secret_scopes:
  - project-local
mutation_scopes:
  - build-artifacts
  - project-formatting
  - release-artifacts
interactive: false
headless_safe: true
failure_classes:
  - missing_project_root
  - missing_xcode_container
  - missing_project_command
  - xcodebuild_failed
override: null
