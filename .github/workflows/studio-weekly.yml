name: Weekly Studio Digest

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post weekly digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/studio-weekly.sh --repo "${{ github.repository }}" --post
