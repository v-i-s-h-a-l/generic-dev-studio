# Apollo network-efficiency chain.
#
# Dry-run first:
#   HOME=/Users/vishalsingh scripts/studio-chain-runner.sh chains/apollo-network-efficiency.yaml --dry-run
#
# Execute the full ordered sequence:
#   HOME=/Users/vishalsingh scripts/studio-chain-runner.sh chains/apollo-network-efficiency.yaml --host codex
#
# Or via the studio router:
#   /studio work chain apollo-network-efficiency
#
# This manifest intentionally uses one issue per chain. The chain runner may
# run multiple issues inside one chain concurrently, while these Apollo network
# issues are dependency-ordered: evidence catalogue -> mode pack -> capture
# paths -> recommendation archetypes -> docs and capability surfaces. Landing
# one reviewed PR per issue keeps later work based on the already-merged output
# of earlier work and preserves a clean abort point if review blocks.
#
# Parent umbrella #280 is intentionally not included; these chains execute the
# concrete network-efficiency child issues only.
#
# Interactive exception: when the user explicitly asks for active-session-only
# Codex work and forbids chain runners/background jobs, a single isolated branch
# with per-issue commits plus foreground phase reviews is acceptable. This
# manifest remains the automated runner shape.

schema_version: 1
chains:
  - name: apollo-network-425-evidence-catalogue
    base: main
    branch: feature/apollo-network-425-evidence-catalogue
    host: auto
    issues: [425]

