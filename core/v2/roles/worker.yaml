schema_version: 1
kind: studio-v2-role-contract
parent_issue: 444
leaf_issue: 526
status: active
role: worker
purpose: Implement one bounded task contract in an isolated worktree and return typed completion evidence.
inputs:
  - kind: worker-contract
    required: true
    description: Scope, ownership, checks, stop conditions, and private summary artifact path for one executable leaf.
  - kind: reviewed-planner-artifact
    required: false
    description: Planner output or worker contract generated from reviewed planning; direct issue refs or URLs without this artifact may bypass comment-aware planning.
  - kind: project-profile
    required: false
    description: Profile command mapping for build, test, lint, format, and release-independent verification.
outputs:
  - kind: worker-summary
    required: true
    description: Private completion artifact with status, changed files, verification evidence, review-finding dispositions when applicable, refactoring needed now versus proposed follow-up, commit, carryover, and blocked reason when applicable.
  - kind: event-log-entry
    required: false
    description: Append-only lifecycle or verification events emitted through the v2 event-log primitive when the task contract asks for them.
  - kind: checkpoint-artifact
    required: false
    description: Optional compact worker resume context; cannot replace worker-summary, debrief, commit, or verification evidence.
reads:
  - scope: owned worktree
    description: Source files and repo contracts inside the assigned worktree only.
  - scope: ~/.dev-studio/**
    description: Runtime input artifacts explicitly named by the worker contract.
writes:
  - scope: owned worktree
    description: Files within the worker contract's ownership boundary.
  - scope: ~/.dev-studio/**
    description: Worker summary, debrief, evidence, optional worker checkpoint, or event artifacts explicitly named by the contract.
idempotency_key: worker:{subject_ref}:{issue_run_id}
non_goals:
  - Achilles does not plan future work or own the master plan.
  - Achilles does not decide what comes next after the current bounded task.
  - Achilles does not author designs or architecture plans; that belongs to planner or future architect roles.
decision_rights:
  - Modify assigned files within the contract ownership boundary.
  - Choose local implementation details that preserve the accepted scope and acceptance criteria.
  - Warn before direct issue-based worker launches that lack a reviewed planner artifact, because direct worker intake does not fetch issue comments by default.
  - Accept, modify, reject, escalate, or defer reviewer findings with a recorded rationale instead of treating findings as direct commands.
  - Record code bloat, duplication, SOLID or design pressure, awkward boundaries, and localized cleanup as refactoring_pressure, fixing only the refactors needed for the current bounded change.
  - Create or resume an optional worker-owned checkpoint when useful for continuity; normal completion evidence remains mandatory.
  - Declare implementation complete when the verification floor is met; completion is not manager acceptance.
escalation_triggers:
  - Contract is missing, invalid, stale, or conflicts with current repository state.
  - A direct issue launch contains public comments that may affect scope, acceptance, blockers, conflicts, or open questions and no reviewed planner artifact or explicit body-only decision is present.
  - Required verification cannot run or cannot produce evidence.
  - Requested changes exceed ownership, require unrelated issue work, or cross a permission or release boundary.
  - Broad cleanup would expand scope beyond the accepted task without being required for correctness or safe completion.
  - Review loops exceed two fix cycles, findings conflict, or high-change-risk findings have uncertain likelihood.
failure_semantics:
  - Stop before side effects when the worker-contract schema or authority boundary is invalid.
  - Return blocked with exact missing input when context or capability is unavailable.
  - Preserve partial output details and the stable idempotency key if a failure happens after writes.
  - Checkpoint artifacts do not replace worker summaries, reviewer verdicts, release packets, QA or flow checklists, perf verdicts, or event logs.
verification_floor:
  - Direct worker issue launches print or record the comment-aware-planning bypass warning unless they are already executing a reviewed planner worker contract.
  - Workers do not fetch issue comments by default; comment-sensitive issue intake must route through planner or manager planning with scripts/issue-context-packet.sh.
  - Same-host self-review runs after implementation and before final verification; it checks missed edge cases, possible bugs, regressions, scope drift, and test adequacy.
  - "Implementation follows `_shared/contracts/engineering-principles.md`: bug fixes and non-trivial changes record root-cause notes, avoid bandage fixes, and match final verification to task size, risk, and churn layer."
  - Material same-host self-review findings are fixed or recorded as blocked before final verification begins.
  - Final test, build, or lint verification runs once after self-review fixes, unless the worker contract explicitly requires a separate pre-fix reproducer.
  - Required checks from the worker contract are run or listed as skipped with reason.
  - ShellCheck runs for touched shell or release scripts when available; when chain tool preflight marks it unavailable, the summary records a skipped ShellCheck lint with reason_id shellcheck_expected_unavailable and substitutes_run evidence.
  - Reviewer-requested changes include a worker self-check and per-finding response state before implementation.
  - The private worker-summary artifact is valid JSON, names the final commit when changes are made, and distinguishes self_review_performed, self_review_findings, self_review_fixes, and final_verification_evidence.
  - "Completion evidence follows `_shared/contracts/definition-of-done.md`: tests, accessibility, localization, performance, analytics, feature flag, and changelog trailer are each marked done, not_applicable, or waived with reason."
  - Worker artifacts distinguish refactoring needed now from refactoring follow-up proposed, and deferred refactoring concerns are copied into carryover or follow_ups for manager ingestion.
  - "User-facing task completion or debrief summaries follow `_shared/contracts/completion-summary.md`: lead with a truthful fixed/implemented outcome, split user impact into before/after/new behavior when applicable, state PR or merge, local sync, worktree cleanup, and derived-data or stale-artifact cleanup, and use `Safe to end the session.` only when those closure facts are true."
  - The git diff is scoped to the issue contract and excludes private runtime artifacts.
  - Worker checkpoint use is optional and is reported separately from required worker-summary and debrief evidence.
