schema_version: 1
name: dev-studio
invocation:
  slash_command: "/dev-studio"
  default_mode: "manager"
  triggers:
    - "/dev-studio"
    - "route through the Studio v2 umbrella skill"
    - "use the canonical Studio v2 role router"
    - "(studio-feedback)"
    - "(studio feedback)"
    - "/dev-studio checkpoint"
    - "/dev-studio resume-checkpoint"
    - "/dev-studio <role> checkpoint"
    - "/dev-studio <role> resume-checkpoint"
    - "/dev-studio help"
    - "/dev-studio <role> help"
    - "/dev-studio manager plan-chain"
    - "/dev-studio manager plan-chain --execute"
    - "/dev-studio manager work-chain --from-plan"
    - "active dev-studio role"
    - "session-local dev-studio role"
domains:
  - studio-v2
  - forge
