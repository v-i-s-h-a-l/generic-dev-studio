schema_version: 1
name: dev-studio
invocation:
  slash_command: "/dev-studio"
  default_mode: "manager"
  triggers:
    - "/dev-studio"
    - "route through the Studio v2 umbrella skill"
    - "use the canonical Studio v2 role router"
    - "(studio-feedback)"
    - "(studio feedback)"
    - "/dev-studio checkpoint"
    - "/dev-studio resume-checkpoint"
    - "/dev-studio <role> checkpoint"
    - "/dev-studio <role> resume-checkpoint"
    - "/dev-studio help"
    - "/dev-studio <role> help"
    - "/dev-studio manager"
    - "/dev-studio manager help"
    - "/dev-studio manager plan-chain"
    - "/dev-studio manager plan-chain <goal-or-issue>"
    - "/dev-studio manager plan-chain --execute"
    - "/dev-studio manager composite-chain"
    - "/dev-studio manager composite-chain run --manifest"
    - "/dev-studio manager composite-chain init --manifest"
    - "/dev-studio manager composite-chain status"
    - "/dev-studio manager composite-chain resume"
    - "/dev-studio manager composite-chain resume --continue"
    - "/dev-studio manager work-chain"
    - "/dev-studio manager work-chain <chain>"
    - "/dev-studio manager work-chain --from-plan"
    - "/dev-studio manager work-chain --discover"
    - "/dev-studio manager work-chain --resume"
    - "/dev-studio manager work-chain --doctor"
    - "fix with /dev-studio manager"
    - "plan with /dev-studio manager"
    - "ship with /dev-studio manager"
    - "resume with /dev-studio manager"
    - "status with /dev-studio manager"
    - "active dev-studio role"
    - "session-local dev-studio role"
domains:
  - studio-v2
  - forge
